name: Build Serven APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Serven-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract the prepared source
        shell: bash
        run: |
          echo '0774294dd2dd6cc47ddb85fd6258198d73f8c1d847ac40e9fafe163cad594086  Serven-Source.zip' | sha256sum --check
          unzip -q Serven-Source.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Prepare Android tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Compile Serven
        working-directory: source/Serven-Source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 --console=plain :app:assembleDebug 2>&1 | tee ../../build.log

      - name: Verify the APK and include matching source
        shell: bash
        run: |
          mkdir -p outputs
          cp source/Serven-Source/app/build/outputs/apk/debug/app-debug.apk outputs/Serven-0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose outputs/Serven-0.1.0-debug.apk | tee outputs/signature-check.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging outputs/Serven-0.1.0-debug.apk > outputs/apk-info.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          info = Path('outputs/apk-info.txt').read_text()
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", info, re.M)
          if package is None or package.groups() != ('app.serven.music', '1', '0.1.0'):
              raise SystemExit('Unexpected APK identity or version')
          if "application-label:'Serven'" not in info or "sdkVersion:'26'" not in info:
              raise SystemExit('Unexpected app label or minimum Android SDK')
          print('Verified APK identity, version, launcher name, and minimum Android SDK')
          PY
          cp Serven-Source.zip outputs/
          cp source/Serven-Source/SERVEN_BUILD_INFO.json outputs/
          cp source/Serven-Source/SOURCE_PROVENANCE.json outputs/
          (cd outputs && sha256sum Serven-0.1.0-debug.apk Serven-Source.zip > SHA256SUMS.txt)

      - name: Save the APK and matching source
        uses: actions/upload-artifact@v4
        with:
          name: Serven-APK-and-source
          path: outputs/
          if-no-files-found: error
          retention-days: 30

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Serven-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
